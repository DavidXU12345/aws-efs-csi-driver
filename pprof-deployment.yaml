apiVersion: apps/v1
kind: Deployment
metadata:
  name: efs-csi-driver-pprof
spec:
  replicas: 1
  selector:
    matchLabels:
      app: efs-csi-driver-pprof
  template:
    metadata:
      labels:
        app: efs-csi-driver-pprof
    spec:
      containers:
      - name: efs-plugin
        image: aws-efs-csi-driver:pprof
        args:
        - --endpoint=unix:///csi/csi.sock
        - --pprof-addr=:6060
        ports:
        - containerPort: 6060
          name: pprof
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
        - name: efs-state-dir
          mountPath: /var/lib/csi/pv
        - name: efs-utils-config
          mountPath: /var/amazon/efs
        - name: efs-utils-config-legacy
          mountPath: /etc/amazon/efs-legacy
      volumes:
      - name: socket-dir
        emptyDir: {}
      - name: efs-state-dir
        hostPath:
          path: /var/lib/csi/pv
          type: DirectoryOrCreate
      - name: efs-utils-config
        hostPath:
          path: /var/amazon/efs
          type: DirectoryOrCreate
      - name: efs-utils-config-legacy
        hostPath:
          path: /etc/amazon/efs
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: efs-csi-pprof-service
spec:
  selector:
    app: efs-csi-driver-pprof
  ports:
  - port: 6060
    targetPort: 6060
    name: pprof